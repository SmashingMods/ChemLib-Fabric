name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run server tests
        run: bash gradlew build runGameTest
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ChemLib-26.2
          path: build/libs/
